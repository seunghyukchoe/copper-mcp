[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "copper-mcp"
version = "0.7.0"
description = "Local-first, AI-extensible PCB automation through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "CopperMCP Contributors" }]
keywords = ["pcb", "eda", "mcp", "autorouting", "kicad", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "mcp>=2.0.0,<3.0.0",
  "pydantic>=2.11,<3.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "hypothesis>=6.138,<7",
  "jsonschema>=4.25,<5",
  "mypy>=2.3,<3",
  "pre-commit>=4.3,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
security = [
  "pip-audit>=2.9,<3",
]
kicad = [
  "kicad-python>=0.7,<0.8",
]

[project.scripts]
copper-mcp = "copper_mcp.cli:main"
copper-mcp-server = "copper_mcp.mcp_server:main"

[project.urls]
Documentation = "https://github.com/seunghyukchoe/copper-mcp/tree/main/docs"
Issues = "https://github.com/seunghyukchoe/copper-mcp/issues"
Repository = "https://github.com/seunghyukchoe/copper-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/copper_mcp"]

# The sdist ships an explicit allowlist, not an exclusion list.  Hatchling honours `.gitignore`
# but not `.git/info/exclude`, and this repository keeps agent worktrees under `.claude/worktrees/`
# via the latter — so a default sdist swept in 20,452 files, twenty-eight whole checkouts of this
# repository, and weighed 124 MB against a 544 KB wheel.  An allowlist cannot regress that way when
# something new lands in the tree; a denylist can only be as complete as the last person to edit it.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/schemas",
  "/benchmarks",
  "/hardware",
  "/scripts",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/Dockerfile",
  "/GOVERNANCE.md",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/llms.txt",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B", "A", "C4", "DTZ", "PTH", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
packages = ["copper_mcp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "mcp.*"
follow_untyped_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=copper_mcp --cov-report=term-missing"
testpaths = ["tests"]
