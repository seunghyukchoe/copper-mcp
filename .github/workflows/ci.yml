name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python 3.12)
    runs-on: ubuntu-latest
    # Successful main samples are recorded in .github/ci-budget-calibration.json.
    # Keep the conservative ceiling; faster observations do not retire older samples.
    timeout-minutes: 120
    outputs:
      evidence-python: ${{ steps.plan.outputs.evidence-python }}
      regular-marker: ${{ steps.plan.outputs.regular-marker }}
      evidence-enabled: ${{ steps.plan.outputs.evidence-enabled }}
      evidence-policy: ${{ steps.plan.outputs.evidence-policy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,security]"
      - id: plan
        run: python scripts/ci_test_plan.py --github-output "$GITHUB_OUTPUT" --event-name "${{ github.event_name }}" --base-sha "${{ github.event.pull_request.base.sha || github.event.before }}" --head-sha "${{ github.sha }}"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python scripts/check_commit_message.py --range "${BASE_SHA}..${HEAD_SHA}"
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - run: python scripts/check_version.py
      - run: python scripts/check_ledgers.py
      - run: python scripts/check_adr_numbers.py
      - run: python scripts/check_doc_links.py
      - run: python scripts/check_schema_sets.py
      - run: PYTHONPATH=src python scripts/check_drc_comparability.py
      - run: python scripts/check_ci_budgets.py
      - run: python scripts/check_audio_benchmarks.py
      - run: PYTHONPATH=src python scripts/check_circuit_intents.py
      - run: python scripts/check_secrets.py
      - run: python -m pip_audit .
      - run: python -m build && python scripts/build_pcm_package.py
      - run: python scripts/check_sdist_tracked.py --sdist dist/*.tar.gz
      - run: sha256sum dist/*.whl dist/*.tar.gz dist/*.zip dist/*.metadata.json > dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-distributions
          path: dist/
          if-no-files-found: error

  compatibility:
    name: ${{ matrix.python-version == '3.12' && 'Compatibility Python 3.12' || format('Python {0}', matrix.python-version) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HYPOTHESIS_PROFILE: deterministic-ci
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: make test-compat PYTHON=python TEST_MARKER="${{ github.event_name == 'pull_request' && 'not slow_evidence and not external_router and not networked_provider' || 'not slow_evidence' }}" COVERAGE_ARGS="${{ matrix.python-version == '3.12' && '--cov=copper_mcp --cov-report=term-missing' || '--no-cov' }}" PYTEST_TIMING_ARGS=--durations=20

  evidence:
    name: Evidence (Python ${{ matrix.python-version }})
    needs: quality
    if: needs.quality.outputs.evidence-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HYPOTHESIS_PROFILE: deterministic-ci
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.quality.outputs.evidence-python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: make test-evidence PYTHON=python COVERAGE_ARGS=--no-cov

  package:
    # Preserve the existing protected check while making it depend on every required role.
    name: Python 3.12
    needs: [quality, compatibility, evidence]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Enforce all required roles
        run: test "${{ needs.quality.result == 'success' && needs.compatibility.result == 'success' && (needs.evidence.result == 'success' || (github.event_name == 'pull_request' && needs.evidence.result == 'skipped' && needs.quality.outputs.evidence-enabled == 'false' && needs.quality.outputs.evidence-policy == 'skipped-nonsensitive-pr')) }}" = true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: quality-distributions
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: sha256sum --check dist/SHA256SUMS
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -c "from pathlib import Path; assert len(list(Path('dist').glob('*.whl'))) == 1; assert len(list(Path('dist').glob('*.tar.gz'))) == 1; assert len(list(Path('dist').glob('*.zip'))) == 1; assert len(list(Path('dist').glob('*.metadata.json'))) == 1"
