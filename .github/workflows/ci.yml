name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # 120 minutes, calibrated rather than chosen. The slowest recorded hosted leg of this job is
    # 2,088 s (34m48s, Python 3.12), so the half rule -- a budget is at least twice the longest
    # recorded duration -- needs 70 minutes and this is 120. The measurements are in
    # `.github/ci-budget-calibration.json` and `scripts/check_ci_budgets.py` enforces the rule; do
    # not move this number without re-recording that file. This job had no budget at all until
    # now, which is not the same as having a generous one: an unbounded job cannot be cancelled by
    # a ceiling, but it also cannot tell anyone the suite has grown.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The policy-order benchmark replays its committed evidence harness with `git show`.
        # A shallow checkout omits that immutable historical source and makes all Python jobs fail.
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,security]"
      # P0.4: the server twin of the `commit-msg` hook. The hook only ever protected an author who
      # had it installed and did not bypass it, and a rejection swallowed by the loop driving the
      # commit looks exactly like a hook that passed -- which is how this class reached `main`
      # twice. It runs on one matrix leg because the answer cannot differ between interpreters,
      # and inside this job rather than beside it so it needs no timeout budget of its own (see
      # `.github/ci-budget-calibration.json`: an uncalibrated budget is a guess).
      - name: Check commit message conventions
        if: github.event_name == 'pull_request' && matrix.python-version == '3.12'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_commit_message.py --range "${BASE_SHA}..${HEAD_SHA}"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Unit tests
        run: python -m pytest
      - name: Validate metadata and ledgers
        run: python scripts/check_version.py && python scripts/check_ledgers.py
      - name: Validate ADR number allocation
        run: python scripts/check_adr_numbers.py
      - name: Check documentation links
        run: python scripts/check_doc_links.py
      # Reads every release tag with `git show`, so it depends on the full checkout above.
      - name: Check published schema accepted sets
        run: python scripts/check_schema_sets.py
      - name: Check published DRC comparability literals
        run: python scripts/check_drc_comparability.py
      # P0.5: both of these have been in `make lint` since before this workflow existed and
      # neither had ever run hosted, so a contributor without a local KiCad-era checkout could
      # break either one and see a green pull request.
      - name: Check audio benchmark catalog
        run: python scripts/check_audio_benchmarks.py
      - name: Check Circuit Intent fixtures
        run: PYTHONPATH=src python scripts/check_circuit_intents.py
      # P0.3: the budgets declared in this directory, against recorded hosted durations.
      - name: Check CI timeout budgets
        run: python scripts/check_ci_budgets.py
      - name: Scan repository for secrets
        run: python scripts/check_secrets.py
      - name: Build packages
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Upload packages
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
