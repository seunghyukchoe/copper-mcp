name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The policy-order benchmark replays its committed evidence harness with `git show`.
        # A shallow checkout omits that immutable historical source and makes all Python jobs fail.
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,security]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src
      - name: Unit tests
        run: python -m pytest
      - name: Validate metadata and ledgers
        run: python scripts/check_version.py && python scripts/check_ledgers.py
      - name: Validate ADR number allocation
        run: python scripts/check_adr_numbers.py
      - name: Check documentation links
        run: python scripts/check_doc_links.py
      # Reads every release tag with `git show`, so it depends on the full checkout above.
      - name: Check published schema accepted sets
        run: python scripts/check_schema_sets.py
      - name: Check published DRC comparability literals
        run: python scripts/check_drc_comparability.py
      - name: Scan repository for secrets
        run: python scripts/check_secrets.py
      - name: Build packages
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Upload packages
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
