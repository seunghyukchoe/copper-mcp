name: Export v0.9.0 source snapshot

on:
  push:
    branches:
      - "agent/source-export-v0.9.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Package checkout
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/source-export-sha.txt
          git status --short > /tmp/source-export-status.txt
          tar --exclude=.git -czf /tmp/source-export.tar.gz .
      - name: Upload checkout
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-export-v0.9.0
          path: |
            /tmp/source-export.tar.gz
            /tmp/source-export-sha.txt
            /tmp/source-export-status.txt
          if-no-files-found: error
          retention-days: 1
