name: v0.9.0 release token probe

on:
  push:
    branches:
      - release/v0.9.0-evidence

permissions:
  contents: read

jobs:
  probe:
    name: Probe named external tag tokens
    runs-on: ubuntu-24.04
    steps:
      - name: Record presence without exporting values
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          COPPER_RELEASE_TOKEN: ${{ secrets.COPPER_RELEASE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p token-probe
          : > token-probe/presence.log
          for name in RELEASE_TOKEN RELEASE_PAT COPPER_RELEASE_TOKEN GH_PAT GITHUB_PAT PERSONAL_ACCESS_TOKEN; do
            if [ -n "${!name}" ]; then
              printf 'present %s\n' "$name" >> token-probe/presence.log
            else
              printf 'absent %s\n' "$name" >> token-probe/presence.log
            fi
          done
          cat token-probe/presence.log

      - name: Upload presence record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v0.9.0-release-token-presence
          path: token-probe/presence.log
          if-no-files-found: error
          retention-days: 1
