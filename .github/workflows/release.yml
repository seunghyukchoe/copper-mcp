name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to verify without publishing (for example, v0.1.0)
        required: true
        default: "v0.2.0"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    # 120 minutes. The v0.7.0 release run was cancelled by its own 20-minute budget: the gate's
    # pytest step alone had grown past 20 minutes and nobody re-measured the budget as the suite
    # grew, so the publish job was skipped and the release shipped without provenance (D-196).
    # Rule: when the measured gate exceeds half of any CI timeout budget, raise the budget in the
    # same PR that grew the gate — a timeout is a calibrated ceiling like max_fill_vertices, not
    # a constant.
    timeout-minutes: 120
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release toolchain
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,security]"
      - name: Verify requested version
        run: python scripts/check_version.py --tag "${RELEASE_VERSION}"
      - name: Run release gate
        run: make check
      # The KiCad Plugin and Content Manager archive is built into the same dist/ directory as the
      # wheel and the sdist, so `actions/attest` covers it under the existing `dist/*` subject path
      # and `gh release create` uploads it. There is deliberately no separate attestation step to
      # fall out of step with the Python distributions.
      - name: Build the KiCad PCM package
        run: python scripts/build_pcm_package.py --expect-version "${RELEASE_VERSION}"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-distributions
          path: dist
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${RELEASE_VERSION}" dist/* --generate-notes --verify-tag --repo "${GITHUB_REPOSITORY}"
