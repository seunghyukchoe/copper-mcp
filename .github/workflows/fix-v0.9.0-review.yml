name: Fix v0.9.0 release-note review

on:
  push:
    branches:
      - "agent/source-export-v0.9.0"
    paths:
      - ".github/workflows/fix-v0.9.0-review.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-v0.9.0-release-review
  cancel-in-progress: false

jobs:
  fix:
    name: Correct final Board IR version wording
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact reviewed release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.9.0
          fetch-depth: 0
      - name: Confirm expected release head
        run: |
          mkdir -p /tmp/v0.9.0-review-fix
          git rev-parse HEAD > /tmp/v0.9.0-review-fix/before-sha.log
          cat /tmp/v0.9.0-review-fix/before-sha.log
          grep -Fx "2736cad4746bba43fed02a6dcb182348aa1ce5ea" /tmp/v0.9.0-review-fix/before-sha.log
      - name: Correct the stale intermediate-version paragraph
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text()
          old = '''- **`BOARD_IR_SCHEMA_VERSION` moves from `0.2.0` to `0.3.0`, and `0.2.0` is frozen where it
  stands.** `schemas/board-ir/0.3.0.schema.json` is the accepted set for a new document;
  `schemas/board-ir/0.2.0.schema.json` is byte-frozen at its `v0.8.0` bytes and is **not** corrected
  retroactively. A persisted `0.2.0` envelope no longer decodes — the codec refuses it with a typed
  discriminated `schema.version` code — so re-convert from the source `.kicad_pcb`; there is no
  auto-migration, exactly as `0.1` → `0.2` had none. `BoardIrSummary.ir_schema_version` now reports
  `0.3.0`. Both frozen schemas, `board-ir/0.1.0` and `board-ir/0.2.0`, carry a **sha256 pin of
  their published bytes**: an accepted-set gate cannot enforce a byte freeze, and a review proved
  it by rewriting all 2,046 lines of `0.2.0` while everything stayed green.
'''
          new = '''- **The first 0.9.0 accepted-set hop moves `BOARD_IR_SCHEMA_VERSION` from `0.2.0` to
  `0.3.0`; the later custom-pad hop moves it again to the shipped `0.4.0`.**
  `schemas/board-ir/0.3.0.schema.json` is the frozen intermediate accepted set, while
  `schemas/board-ir/0.4.0.schema.json` is the accepted set for every new 0.9.0 document.
  `schemas/board-ir/0.2.0.schema.json` remains byte-frozen at its `v0.8.0` bytes and is **not**
  corrected retroactively. Persisted `0.2.0` and `0.3.0` envelopes no longer decode — the codec
  refuses them with a typed discriminated `schema.version` code — so re-convert from the source
  `.kicad_pcb`; there is no auto-migration, exactly as `0.1` → `0.2` had none.
  `BoardIrSummary.ir_schema_version` now reports the final shipped literal `0.4.0`. The frozen
  schemas `board-ir/0.1.0`, `board-ir/0.2.0` and `board-ir/0.3.0` carry byte-integrity protection;
  an accepted-set gate alone cannot enforce a byte freeze, and a review proved it by rewriting all
  2,046 lines of `0.2.0` while everything stayed green.
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one stale paragraph, found {count}")
          path.write_text(text.replace(old, new))
          PY
          git diff --check > /tmp/v0.9.0-review-fix/diff-check.log 2>&1
          cat /tmp/v0.9.0-review-fix/diff-check.log
          git diff -- CHANGELOG.md > /tmp/v0.9.0-review-fix/change.log
          cat /tmp/v0.9.0-review-fix/change.log
      - name: Configure release author
        run: |
          git config user.name "studio dawol"
          git config user.email "seunghyukchoe@gmail.com"
      - name: Stage the review fix
        run: git add CHANGELOG.md
      - name: Commit the review fix
        run: |
          git commit -m "docs(release): correct final Board IR version"
      - name: Confirm the commit subject
        run: |
          git log --oneline -1 > /tmp/v0.9.0-review-fix/commit.log
          cat /tmp/v0.9.0-review-fix/commit.log
          grep -E '^[0-9a-f]+ docs\(release\): correct final Board IR version$' /tmp/v0.9.0-review-fix/commit.log
      - name: Push the corrected release branch
        run: |
          git push origin HEAD:release/v0.9.0
      - name: Upload review-fix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v0.9.0-review-fix-evidence
          path: /tmp/v0.9.0-review-fix/
          if-no-files-found: warn
          retention-days: 14
