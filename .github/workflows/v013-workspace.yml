name: V013 contract workspace

on:
  push:
    branches: [automation/v013-contract-workspace-20260905]
    paths: [.github/workflows/v013-workspace.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 40db464939a89f45feefbf067a750ffc3e06a97b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Export exact tracked history and offline development dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/copper-v013/wheels"
          test "$(git rev-parse HEAD)" = 40db464939a89f45feefbf067a750ffc3e06a97b
          git bundle create "$RUNNER_TEMP/copper-v013/workspace.bundle" HEAD --tags
          git rev-parse HEAD > "$RUNNER_TEMP/copper-v013/BASE_SHA"
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'copper-v013'
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          reqs = data['project']['dependencies'] + data['project']['optional-dependencies']['dev'] + data['project']['optional-dependencies']['security'] + data['build-system']['requires']
          (root / 'requirements.txt').write_text('\n'.join(reqs) + '\n')
          PY
          python -m pip download --only-binary=:all: --dest "$RUNNER_TEMP/copper-v013/wheels" -r "$RUNNER_TEMP/copper-v013/requirements.txt"
          cd "$RUNNER_TEMP/copper-v013"
          sha256sum workspace.bundle > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: copper-v013-pinned-workspace
          path: ${{ runner.temp }}/copper-v013/
          retention-days: 1
          if-no-files-found: error
