name: v0.9.0 release evidence

on:
  push:
    branches:
      - release/v0.9.0-evidence

permissions:
  contents: write

env:
  SOURCE_SHA: d5affff0d404bef987d691f1ea50917f7ba5bc48
  AUTH_BRANCH: release/v0.9.0-authorization
  CI_RUN: "31916332506"
  SECURITY_RUN: "31916332504"
  CODEQL_RUN: "31916332501"
  SCORECARD_RUN: "31916332548"
  INSERT_B64: >-
    
  ANCHOR_B64: PiAqKnYwLjUuMCBhdXRob3JpemF0aW9uIGNvcnJlY3Rpb24=

jobs:
  authorize:
    name: Wait for exact main gates and append authorization
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for exact-source main workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p authorization-logs
          for run_id in "${CI_RUN}" "${SECURITY_RUN}" "${CODEQL_RUN}" "${SCORECARD_RUN}"; do
            while true; do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "authorization-logs/run-${run_id}.json" 2>&1
              cat "authorization-logs/run-${run_id}.json"
              head_sha="$(jq -r '.head_sha' "authorization-logs/run-${run_id}.json")"
              status="$(jq -r '.status' "authorization-logs/run-${run_id}.json")"
              conclusion="$(jq -r '.conclusion // ""' "authorization-logs/run-${run_id}.json")"
              test "$head_sha" = "${SOURCE_SHA}"
              if [ "$status" = completed ]; then
                if [ "$conclusion" != success ]; then
                  printf 'run %s completed with %s\n' "$run_id" "$conclusion" > "authorization-logs/run-${run_id}-failure.log"
                  cat "authorization-logs/run-${run_id}-failure.log"
                  exit 1
                fi
                break
              fi
              sleep 30
            done
          done

      - name: Check out the authorization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.AUTH_BRANCH }}
          fetch-depth: 0

      - name: Bind source and append ledger rows
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > authorization-logs/source-sha.log 2>&1
          cat authorization-logs/source-sha.log
          test "$(cat authorization-logs/source-sha.log)" = "${SOURCE_SHA}"
          python -c "import base64, os; from pathlib import Path; p=Path('docs/ledgers/release-ledger.md'); t=p.read_text(); a=base64.b64decode(os.environ['ANCHOR_B64']).decode(); i=base64.b64decode(os.environ['INSERT_B64']).decode(); assert t.count(a)==1, t.count(a); assert '| 0.9.0 |' not in t; assert 'Outstanding publication — 0.9.0' not in t; p.write_text(t.replace(a, i+a, 1))" > authorization-logs/edit-ledger.log 2>&1
          cat authorization-logs/edit-ledger.log
          git diff --check > authorization-logs/diff-check.log 2>&1
          cat authorization-logs/diff-check.log
          git status --porcelain=v1 > authorization-logs/status.log 2>&1
          cat authorization-logs/status.log
          test "$(cat authorization-logs/status.log)" = ' M docs/ledgers/release-ledger.md'

      - name: Validate authorization metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_ledgers.py > authorization-logs/check-ledgers.log 2>&1
          cat authorization-logs/check-ledgers.log
          python scripts/check_version.py --tag v0.9.0 > authorization-logs/check-version-tag.log 2>&1
          cat authorization-logs/check-version-tag.log

      - name: Commit authorization metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CopperMCP Release Automation'
          git config user.email 'seunghyukchoe@users.noreply.github.com'
          git add docs/ledgers/release-ledger.md
          git commit -m 'chore(release): authorize v0.9.0' > authorization-logs/git-commit.log 2>&1
          cat authorization-logs/git-commit.log

      - name: Verify commit subject
        shell: bash
        run: |
          set -euo pipefail
          git log --oneline -1 > authorization-logs/git-log.log 2>&1
          cat authorization-logs/git-log.log
          git log -1 --pretty=%s > authorization-logs/git-subject.log 2>&1
          cat authorization-logs/git-subject.log
          grep -Fxq 'chore(release): authorize v0.9.0' authorization-logs/git-subject.log

      - name: Push authorization branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${AUTH_BRANCH}" > authorization-logs/git-push.log 2>&1
          cat authorization-logs/git-push.log

      - name: Upload authorization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v0.9.0-authorization-evidence
          path: authorization-logs/
          if-no-files-found: warn
          retention-days: 14
