name: v0.9.0 release authorization recovery

on:
  push:
    branches:
      - release/v0.9.0-evidence

permissions:
  contents: write

env:
  SOURCE_SHA: d5affff0d404bef987d691f1ea50917f7ba5bc48
  AUTH_BRANCH: release/v0.9.0-authorization

jobs:
  recover:
    name: Recreate and publish the validated ledger-only commit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out evidence history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v0.9.0-evidence
          fetch-depth: 0

      - name: Recover the reviewed ledger payload from the parent commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authorization-logs
          python - <<'PY' > authorization-logs/recover-payload.log 2>&1
          import re
          import subprocess
          from pathlib import Path

          path = '.github/workflows/v0.9.0-release-evidence.yml'
          previous = subprocess.check_output(['git', 'show', f'HEAD^:{path}'], text=True)
          match = re.search(
              r'^  INSERT_B64: >-\n((?:    .*\n)+?)  ANCHOR_B64:',
              previous,
              flags=re.MULTILINE,
          )
          if match is None:
              raise SystemExit('reviewed INSERT_B64 payload not found in parent workflow')
          encoded = ''.join(line.strip() for line in match.group(1).splitlines())
          Path('/tmp/v0.9.0-authorization-insert.b64').write_text(encoded, encoding='ascii')
          print(f'recovered {len(encoded)} base64 characters from the reviewed parent commit')
          PY
          cat authorization-logs/recover-payload.log

      - name: Check out the exact release source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${SOURCE_SHA}" > authorization-logs/checkout-source.log 2>&1
          cat authorization-logs/checkout-source.log
          git rev-parse HEAD > authorization-logs/source-sha.log 2>&1
          cat authorization-logs/source-sha.log
          test "$(cat authorization-logs/source-sha.log)" = "${SOURCE_SHA}"
          git checkout -B "${AUTH_BRANCH}" "${SOURCE_SHA}" > authorization-logs/checkout-branch.log 2>&1
          cat authorization-logs/checkout-branch.log

      - name: Append the reviewed authorization rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > authorization-logs/edit-ledger.log 2>&1
          import base64
          from pathlib import Path

          ledger = Path('docs/ledgers/release-ledger.md')
          text = ledger.read_text(encoding='utf-8')
          anchor = '> **v0.5.0 authorization correction'
          encoded = Path('/tmp/v0.9.0-authorization-insert.b64').read_text(encoding='ascii')
          insertion = base64.b64decode(encoded).decode('utf-8')
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one authorization anchor, found {text.count(anchor)}')
          if '| 0.9.0 |' in text or 'Outstanding publication — 0.9.0' in text:
              raise SystemExit('v0.9.0 authorization metadata already exists in source ledger')
          ledger.write_text(text.replace(anchor, insertion + anchor, 1), encoding='utf-8')
          print('appended reviewed Blocked and Ready rows plus outstanding-publication marker')
          PY
          cat authorization-logs/edit-ledger.log
          git diff --check > authorization-logs/diff-check.log 2>&1
          cat authorization-logs/diff-check.log
          git status --porcelain=v1 --untracked-files=no > authorization-logs/status.log 2>&1
          cat authorization-logs/status.log
          test "$(cat authorization-logs/status.log)" = ' M docs/ledgers/release-ledger.md'

      - name: Commit authorization metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CopperMCP Release Automation'
          git config user.email 'seunghyukchoe@users.noreply.github.com'
          git add docs/ledgers/release-ledger.md
          git commit -m 'chore(release): authorize v0.9.0' > authorization-logs/git-commit.log 2>&1
          cat authorization-logs/git-commit.log

      - name: Verify commit subject and metadata gates
        shell: bash
        run: |
          set -euo pipefail
          git log --oneline -1 > authorization-logs/git-log.log 2>&1
          cat authorization-logs/git-log.log
          git log -1 --pretty=%s > authorization-logs/git-subject.log 2>&1
          cat authorization-logs/git-subject.log
          grep -Fxq 'chore(release): authorize v0.9.0' authorization-logs/git-subject.log
          python scripts/check_ledgers.py > authorization-logs/check-ledgers.log 2>&1
          cat authorization-logs/check-ledgers.log
          python scripts/check_version.py --tag v0.9.0 > authorization-logs/check-version-tag.log 2>&1
          cat authorization-logs/check-version-tag.log
          git status --porcelain=v1 --untracked-files=no > authorization-logs/final-status.log 2>&1
          cat authorization-logs/final-status.log
          test ! -s authorization-logs/final-status.log

      - name: Force-update only the authorization branch
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/${AUTH_BRANCH}" > authorization-logs/git-push.log 2>&1
          cat authorization-logs/git-push.log

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v0.9.0-authorization-recovery
          path: authorization-logs/
          if-no-files-found: warn
          retention-days: 14
