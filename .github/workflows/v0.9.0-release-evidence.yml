name: v0.9.0 release evidence

on:
  push:
    branches:
      - release/v0.9.0-evidence

permissions:
  contents: write

jobs:
  probe:
    name: Probe workflow write policy
    runs-on: ubuntu-24.04
    steps:
      - name: Report token permission context
        shell: bash
        run: |
          set -euo pipefail
          printf 'workflow parsed and runner allocated\n'
