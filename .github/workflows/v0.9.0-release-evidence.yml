name: v0.9.0 release evidence

on:
  push:
    branches:
      - release/v0.9.0-evidence

permissions:
  contents: read

jobs:
  evidence:
    name: Regenerate KiCad evidence and run the release gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply the prospective v0.9.0 source overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-logs
          tar -xJf .github/release-evidence/v0.9.0-source-overlay.tar.xz -C . \
            > release-logs/apply-overlay.log 2>&1
          cat release-logs/apply-overlay.log

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install KiCad 10.0.5
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update > release-logs/apt-base-update.log 2>&1
          cat release-logs/apt-base-update.log
          sudo apt-get install --yes software-properties-common \
            > release-logs/apt-software-properties.log 2>&1
          cat release-logs/apt-software-properties.log
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases \
            > release-logs/apt-kicad-ppa.log 2>&1
          cat release-logs/apt-kicad-ppa.log
          sudo apt-get update > release-logs/apt-kicad-update.log 2>&1
          cat release-logs/apt-kicad-update.log
          sudo apt-get install --yes --no-install-recommends kicad \
            > release-logs/apt-kicad-install.log 2>&1
          cat release-logs/apt-kicad-install.log
          python - <<'PY' > release-logs/kicad-version.log 2>&1
          import subprocess

          completed = subprocess.run(
              ["kicad-cli", "--version"],
              check=True,
              capture_output=True,
              text=True,
          )
          version = completed.stdout.strip()
          print(version)
          if not version.startswith("10.0.5"):
              raise SystemExit(f"expected KiCad 10.0.5, got {version!r}")
          PY
          cat release-logs/kicad-version.log

      - name: Install the complete release toolchain
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip > release-logs/pip-upgrade.log 2>&1
          cat release-logs/pip-upgrade.log
          python -m pip install -e ".[dev,security]" > release-logs/pip-install.log 2>&1
          cat release-logs/pip-install.log

      - name: Regenerate and bind the route-bundle artifact
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/benchmark_route_bundle.py --write \
            > release-logs/route-bundle.log 2>&1
          cat release-logs/route-bundle.log
          python - <<'PY' > release-logs/route-bundle-assert.log 2>&1
          import json
          from pathlib import Path

          path = Path("benchmarks/results/routing/2026-08-05-route-bundle-v1.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          authority = report["authoritative_kicad_drc"]
          assert report["copper_mcp_version"] == "0.9.0", report
          assert authority["status"] == "completed", authority
          assert authority["kicad_version"] == "10.0.5", authority
          assert authority["passed"] is True, authority
          print(json.dumps(authority, indent=2, sort_keys=True))
          PY
          cat release-logs/route-bundle-assert.log

      - name: Run every release gate with file-backed output
        shell: bash
        run: |
          set -euo pipefail
          run_logged() {
            local name="$1"
            shift
            set +e
            "$@" > "release-logs/${name}.log" 2>&1
            local status=$?
            set -e
            cat "release-logs/${name}.log"
            return "$status"
          }

          run_logged ruff-check python -m ruff check .
          run_logged ruff-format python -m ruff format --check .
          run_logged mypy python -m mypy src
          run_logged check-version python scripts/check_version.py
          run_logged check-ledgers python scripts/check_ledgers.py
          run_logged check-adr-numbers python scripts/check_adr_numbers.py
          run_logged check-doc-links python scripts/check_doc_links.py
          run_logged check-schema-sets python scripts/check_schema_sets.py
          run_logged check-ci-budgets python scripts/check_ci_budgets.py
          run_logged check-drc-comparability python scripts/check_drc_comparability.py
          run_logged pytest python -m pytest
          run_logged secret-scan python scripts/check_secrets.py
          run_logged pip-audit python -m pip_audit .
          rm -rf build dist
          run_logged build python -m build

      - name: Upload evidence and generated distributions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v0.9.0-release-evidence
          path: |
            release-logs/
            benchmarks/results/routing/2026-08-05-route-bundle-v1.json
            dist/
          if-no-files-found: warn
          retention-days: 14
