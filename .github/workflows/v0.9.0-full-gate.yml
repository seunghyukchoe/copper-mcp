name: v0.9.0 exact-source full gate

on:
  push:
    branches:
      - "agent/source-export-v0.9.0"
    paths:
      - ".github/workflows/v0.9.0-full-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0.9.0-exact-source-full-gate
  cancel-in-progress: false

jobs:
  gate:
    name: File-backed full release gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2736cad4746bba43fed02a6dcb182348aa1ce5ea
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install complete release toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/v0.9.0-full-gate
          set +e
          python -m pip install --upgrade pip > /tmp/v0.9.0-full-gate/pip-upgrade.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/pip-upgrade.log
          test "$status" -eq 0
          set +e
          python -m pip install -e ".[dev,security]" > /tmp/v0.9.0-full-gate/install.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/install.log
          test "$status" -eq 0
      - name: Ruff lint
        run: |
          set +e
          python -m ruff check . > /tmp/v0.9.0-full-gate/ruff-check.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/ruff-check.log
          exit "$status"
      - name: Ruff format check
        run: |
          set +e
          python -m ruff format --check . > /tmp/v0.9.0-full-gate/ruff-format.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/ruff-format.log
          exit "$status"
      - name: Mypy source
        run: |
          set +e
          python -m mypy src > /tmp/v0.9.0-full-gate/mypy.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/mypy.log
          exit "$status"
      - name: Check source version
        run: |
          set +e
          python scripts/check_version.py > /tmp/v0.9.0-full-gate/check-version.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/check-version.log
          exit "$status"
      - name: Check ledgers
        run: |
          set +e
          python scripts/check_ledgers.py > /tmp/v0.9.0-full-gate/check-ledgers.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/check-ledgers.log
          exit "$status"
      - name: Check ADR numbers
        run: |
          set +e
          python scripts/check_adr_numbers.py > /tmp/v0.9.0-full-gate/check-adr-numbers.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/check-adr-numbers.log
          exit "$status"
      - name: Check documentation links
        run: |
          set +e
          python scripts/check_doc_links.py > /tmp/v0.9.0-full-gate/check-doc-links.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/check-doc-links.log
          exit "$status"
      - name: Check schema accepted sets
        run: |
          set +e
          python scripts/check_schema_sets.py > /tmp/v0.9.0-full-gate/check-schema-sets.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/check-schema-sets.log
          exit "$status"
      - name: Check CI budgets
        run: |
          set +e
          python scripts/check_ci_budgets.py > /tmp/v0.9.0-full-gate/check-ci-budgets.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/check-ci-budgets.log
          exit "$status"
      - name: Check DRC comparability
        run: |
          set +e
          python scripts/check_drc_comparability.py > /tmp/v0.9.0-full-gate/check-drc-comparability.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/check-drc-comparability.log
          exit "$status"
      - name: Check audio benchmark catalog
        run: |
          set +e
          python scripts/check_audio_benchmarks.py > /tmp/v0.9.0-full-gate/check-audio-benchmarks.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/check-audio-benchmarks.log
          exit "$status"
      - name: Check Circuit Intent fixtures
        run: |
          set +e
          env PYTHONPATH=src python scripts/check_circuit_intents.py > /tmp/v0.9.0-full-gate/check-circuit-intents.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/check-circuit-intents.log
          exit "$status"
      - name: Full pytest
        run: |
          set +e
          python -m pytest > /tmp/v0.9.0-full-gate/pytest.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/pytest.log
          exit "$status"
      - name: Secret scan
        run: |
          set +e
          python scripts/check_secrets.py > /tmp/v0.9.0-full-gate/secret-scan.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/secret-scan.log
          exit "$status"
      - name: Dependency audit
        run: |
          set +e
          python -m pip_audit . > /tmp/v0.9.0-full-gate/pip-audit.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/pip-audit.log
          exit "$status"
      - name: Build distributions
        run: |
          rm -rf dist
          set +e
          python -m build > /tmp/v0.9.0-full-gate/build.log 2>&1
          status=$?
          set -e
          cat /tmp/v0.9.0-full-gate/build.log
          exit "$status"
      - name: Record exact source
        run: |
          git rev-parse HEAD > /tmp/v0.9.0-full-gate/source-sha.log
          git status --short > /tmp/v0.9.0-full-gate/source-status.log
          cat /tmp/v0.9.0-full-gate/source-sha.log
          cat /tmp/v0.9.0-full-gate/source-status.log
      - name: Upload full-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v0.9.0-exact-source-full-gate
          path: |
            /tmp/v0.9.0-full-gate/
            dist/
          if-no-files-found: warn
          retention-days: 14
